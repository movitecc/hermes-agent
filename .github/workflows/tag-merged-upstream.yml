name: Tag merged upstream sync

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'automation/sync-upstream-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create release tag from upstream version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name 2>/dev/null || true)"
          if [[ -z "$tag" ]]; then
            tag="v$(python -c 'import pathlib,re; text=pathlib.Path("pyproject.toml").read_text(); print(re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.M).group(1))')"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to publish."
            exit 0
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
